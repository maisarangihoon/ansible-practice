---
- hosts: all
  become: yes
  gather_facts: yes
  tasks:
  - name: install httpd (apt-get install httpd)
    apt:
      name: apache2
      state: present
    when: ansible_os_family == "Debian"
  - name: start the apache2 service
    service:
       name: apache2
       state: started
    when: ansible_os_family == "Debian"
  - name: install ping 
    apt:
      name: iputils-ping
      state: present   
    when: ansible_os_family == "Debian"
  - name: let's start ping service
    ping:
    when: ansible_os_family == "Debian"

       

